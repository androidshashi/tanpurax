<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanpura: Studio Reference</title>
    <style>
        :root {
            --bg: #050505;
            --panel: #111;
            --gold: #eebb44;
            --cyan: #00bcd4;
            --text: #eee;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .studio-unit {
            background: var(--panel);
            width: 440px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9);
            border: 1px solid #333;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 1px solid #333;
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--gold);
            font-size: 1.5rem;
        }

        .vu-meter {
            width: 100px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
        }

        .vu-bar {
            width: 0%;
            height: 100%;
            background: var(--cyan);
            transition: width 0.1s;
            box-shadow: 0 0 10px var(--cyan);
        }

        .controls {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .col {
            flex: 1;
        }

        label {
            display: block;
            font-size: 0.7rem;
            color: #888;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        select,
        input[type=range] {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus {
            border-color: var(--gold);
        }

        #power-btn {
            width: 100%;
            padding: 20px;
            background: var(--gold);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 0 20px rgba(238, 187, 68, 0.2);
        }

        #power-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(238, 187, 68, 0.4);
        }

        #power-btn.active {
            background: #ff3d00;
            color: white;
            box-shadow: 0 0 30px rgba(255, 61, 0, 0.4);
        }

        .mixer-view {
            display: flex;
            justify-content: space-between;
            height: 140px;
            margin: 30px 10px;
            align-items: flex-end;
        }

        .channel {
            width: 4px;
            height: 20%;
            background: #333;
            border-radius: 2px;
            transition: height 0.1s, background 0.2s;
            position: relative;
        }

        .channel.active {
            background: var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
        }

        .ch-label {
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #555;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="studio-unit">
        <div class="header">
            <h1>Tanpura Studio</h1>
            <div class="vu-meter">
                <div class="vu-bar" id="vu"></div>
            </div>
        </div>

        <div class="controls">
            <div class="row">
                <div class="col">
                    <label>Fundamental (Sa)</label>
                    <select id="pitch">
                        <option value="130.81">C3</option>
                        <option value="138.59">C#3</option>
                        <option value="146.83" selected>D3</option>
                        <option value="155.56">D#3</option>
                        <option value="164.81">E3</option>
                        <option value="174.61">F3</option>
                        <option value="185.00">F#3</option>
                        <option value="196.00">G3</option>
                        <option value="207.65">G#3</option>
                        <option value="220.00">A3</option>
                    </select>
                </div>
                <div class="col">
                    <label>First String</label>
                    <select id="first-string">
                        <option value="0.75" selected>Pa (5th)</option>
                        <option value="0.6666">Ma (4th)</option>
                        <option value="0.9375">Ni (7th)</option>
                    </select>
                </div>
            </div>

            <div>
                <label>Tempo (Cycle Speed)</label>
                <input type="range" id="tempo" min="0.5" max="2.0" step="0.1" value="1.0">
            </div>
        </div>

        <div class="mixer-view">
            <div class="channel" id="c0"><span class="ch-label">PA</span></div>
            <div class="channel" id="c1"><span class="ch-label">SA 1</span></div>
            <div class="channel" id="c2"><span class="ch-label">SA 2</span></div>
            <div class="channel" id="c3"><span class="ch-label">BASS</span></div>
        </div>

        <button id="power-btn">Activate System</button>
    </div>

    <script src="tanpura-engine.js"></script>

    <script>
        // Instantiate the engine class we created earlier
        const engine = new TanpuraEngine();

        // UI DOM References
        const btn = document.getElementById('power-btn');
        const vuBar = document.getElementById('vu');
        const pitchSelect = document.getElementById('pitch');
        const stringSelect = document.getElementById('first-string');
        const tempoRange = document.getElementById('tempo');
        const channels = [
            document.getElementById('c0'),
            document.getElementById('c1'),
            document.getElementById('c2'),
            document.getElementById('c3')
        ];

        /**
         * Pushes current UI values into the engine's internal settings.
         */
        function updateEngineParameters() {
            engine.updateSettings(
                pitchSelect.value,
                stringSelect.value,
                tempoRange.value
            );
        }

        /**
         * Visual callback: Triggered by the engine whenever a string is "plucked"
         */
        engine.onTriggerString = (index) => {
            const ch = channels[index];
            if (!ch) return;

            ch.style.height = '100%';
            ch.classList.add('active');

            setTimeout(() => {
                ch.style.height = '20%';
                ch.classList.remove('active');
            }, 800);
        };

        /**
         * VU Meter Loop: Queries the engine's analyzer for real-time volume levels
         */
        function animateVU() {
            if (engine.isPlaying) {
                const rms = engine.getRMS();
                const pct = Math.min(100, rms * 400); // Scaled for visual impact
                vuBar.style.width = pct + '%';
            } else {
                vuBar.style.width = '0%';
            }
            requestAnimationFrame(animateVU);
        }

        // Start the VU animation loop immediately
        animateVU();

        /**
         * Event Listeners
         */
        btn.addEventListener('click', async () => {
            if (engine.isPlaying) {
                engine.stop();
                btn.textContent = "Activate System";
                btn.classList.remove('active');
            } else {
                // Initialize AudioContext on first user gesture
                await engine.init();
                updateEngineParameters();
                engine.start();

                btn.textContent = "Stop System";
                btn.classList.add('active');
            }
        });

        // Live parameter updates (allows changing pitch while playing)
        [pitchSelect, stringSelect, tempoRange].forEach(input => {
            input.addEventListener('input', updateEngineParameters);
        });

    </script>
</body>

</html>
